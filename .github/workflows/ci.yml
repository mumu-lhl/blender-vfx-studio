name: Blender extension
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLENDER_VERSION: 5.2.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: python -m pip install ruff==0.14.1
      - name: Check release tag matches extension version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('blender_vfx_studio/blender_manifest.toml').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and manifest versions differ'
          PYTHON
      - name: Lint
        run: |
          ruff check blender_vfx_studio tools tests
          ruff format --check blender_vfx_studio tools tests
      - name: Download official Blender with checksum verification
        shell: bash
        run: |
          mkdir -p work
          cd work
          base=https://download.blender.org/release/Blender5.2
          curl --fail --location --retry 3 -o blender.tar.xz "$base/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 -o checksums.txt "$base/blender-${BLENDER_VERSION}.sha256"
          mv blender.tar.xz "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          sha256sum --check --ignore-missing checksums.txt
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Native behavior and persistence tests (CPU only)
        run: python tools/test.py
      - name: Package installation, enable and removal
        run: python tools/test_install.py
      - name: Render CPU release preview
        if: github.ref_type == 'tag'
        run: blender -b --factory-startup --python-exit-code 1 --python tools/preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-vfx-studio-extension
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: blender-vfx-studio-preview
          path: work/preview.png

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: blender
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blender-vfx-studio-extension
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: blender-vfx-studio-preview
          path: preview
      - name: Publish tested preview ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS preview/*.png --verify-tag --prerelease --title "$GITHUB_REF_NAME — Blender VFX Studio Preview" --notes 'Blender 5.2 LTS 预览版。下载下方 ZIP，在 Preferences → Get Extensions → Install from Disk 中安装。附带 CPU 渲染预览和 SHA256 校验值。完整功能与限制请阅读仓库 README。' --generate-notes
