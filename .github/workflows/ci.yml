name: Blender extension
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blender-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  blender:
    name: Blender · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # Software Eevee previews plus native opening-frame checks need render time.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      BLENDER_VERSION: 5.2.2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: python -m pip install ruff==0.14.1
      - name: Check release tag matches extension version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('blender_vfx_studio/blender_manifest.toml').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and manifest versions differ'
          notes = pathlib.Path('docs/releases') / (os.environ['GITHUB_REF_NAME'] + '.md')
          assert notes.is_file(), 'Add versioned release notes before tagging'
          PYTHON
      - name: Lint
        run: |
          ruff check blender_vfx_studio tools tests
          ruff format --check blender_vfx_studio tools tests
      - name: Download official Blender with checksum verification
        run: python tools/fetch_blender.py --version "$BLENDER_VERSION"
      - name: Native behavior and persistence tests (CPU only)
        run: python tools/test.py
      - name: Package installation, enable and removal
        run: python tools/test_install.py
      - name: Render CPU release preview
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: |
          blender -b --factory-startup --python-exit-code 1 --python tools/preview.py
          blender -b --factory-startup --python-exit-code 1 --python tools/shield_preview.py
          blender -b --factory-startup --python-exit-code 1 --python tools/emitter_preview.py
          blender -b --factory-startup --python-exit-code 1 --python tools/bone_trail_preview.py
      - name: Ensure Linux software rendering and video tools
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: |
          if python - <<'PYTHON'
          import ctypes, pathlib, shutil
          missing = []
          for name in ('libEGL.so.1', 'libEGL_mesa.so.0', 'libGL.so.1'):
              try:
                  ctypes.CDLL(name)
              except OSError:
                  missing.append(name)
          if not list(pathlib.Path('/usr/lib').glob('*/dri/swrast_dri.so')):
              missing.append('Mesa software DRI driver')
          missing.extend(name for name in ('ffmpeg', 'ffprobe') if not shutil.which(name))
          print('::notice::Render prerequisites: ' + (', '.join(missing) if missing else 'already available'))
          raise SystemExit(bool(missing))
          PYTHON
          then
            exit 0
          fi
          mkdir -p work
          # Ubuntu 24.04 is pinned above. Query only its signed official repositories.
          cat >work/ubuntu-render.sources <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          render_packages=(libegl1 libegl-mesa0 libgl1-mesa-dri)
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            render_packages+=(ffmpeg)
          fi
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/work/ubuntu-render.sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=20)
          if timeout 90 sudo apt-get "${apt_options[@]}" update -qq >work/render-deps.log 2>&1 && timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends "${render_packages[@]}" >>work/render-deps.log 2>&1; then
            cat work/render-deps.log
          else
            python - <<'PYTHON'
          from pathlib import Path
          message = '\n'.join(Path('work/render-deps.log').read_text(errors='replace').splitlines()[-12:])
          print('::error::Render dependency preparation failed: ' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON
            exit 1
          fi
      - name: Render Arc Slash visual review (960x540, CPU, no bloom)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/slash_preview.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/slash_preview.py -- --engine BLENDER_EEVEE --sampled
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/slash_preview.py -- --engine BLENDER_EEVEE --light --sampled
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/slash_preview.py -- --light
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/slash_preview.py -- --engine BLENDER_EEVEE --pale --far --view-transform AgX
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-slash/slash-cycles.blend --python tests/slash_visual_reopen.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-slash/slash-blender_eevee-light.blend --python tests/slash_visual_reopen.py
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: arc-slash-visual-review
          path: |
            work/visual-slash/*.png
            work/visual-slash/*-settings.json
      - name: Render Impact Burst visual review (960x540, CPU, no bloom)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/impact_preview.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/impact_preview.py -- --engine BLENDER_EEVEE
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/impact_preview.py -- --engine BLENDER_EEVEE --light --sampled
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/impact_preview.py -- --light
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/impact_preview.py -- --engine BLENDER_EEVEE --pale --far --view-transform AgX
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-impact/impact-cycles.blend --python tests/impact_visual_reopen.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-impact/impact-blender_eevee-light.blend --python tests/impact_visual_reopen.py
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: impact-burst-visual-review
          path: |
            work/visual-impact/*.png
            work/visual-impact/*-settings.json
      - name: Review Energy Charge gathering and tail (960x540, CPU, no bloom)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/charge_preview.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/charge_preview.py -- --engine BLENDER_EEVEE
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/charge_preview.py -- --light
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/charge_preview.py -- --engine BLENDER_EEVEE --light --sampled
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-charge/cycles/charge.blend --python tests/charge_reopen.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-charge/blender_eevee/charge.blend --python tests/charge_reopen.py
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: energy-charge-visual-review
          path: |
            work/visual-charge/*/charge-*.png
            work/visual-charge/*/charge.blend
            work/visual-charge/*/render-settings.json
      - name: Build combat playback evidence (960x540, CPU, no bloom)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --sequence
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --light
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --engine BLENDER_EEVEE --sequence
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --engine BLENDER_EEVEE --wide
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --engine BLENDER_EEVEE --light
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tools/combat_preview.py -- --engine BLENDER_EEVEE --wide --light --sequence
          python tools/combat_video.py work/visual-combat/dark
          python tools/combat_video.py work/visual-combat/blender_eevee-near-dark
          python tools/combat_video.py work/visual-combat/blender_eevee-wide-light
          python tools/combat_frames.py work/visual-combat/dark
          python tools/combat_frames.py work/visual-combat/blender_eevee-near-dark
          python tools/combat_frames.py work/visual-combat/blender_eevee-wide-light
          python tools/combat_review.py work/visual-combat
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-combat/dark/combat.blend --python tests/combat_reopen.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-combat/blender_eevee-near-dark/combat.blend --python tests/combat_reopen.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 work/visual-combat/blender_eevee-wide-light/combat.blend --python tests/combat_reopen.py
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: combat-shot-visual-review
          path: |
            work/visual-combat/*/combat-*.png
            work/visual-combat/*/combat.blend
            work/visual-combat/*/combat.mp4
            work/visual-combat/*/render-settings.json
            work/visual-combat/*/video-info.json
            work/visual-combat/index.html
            work/visual-combat/*/video-frames/*.png
            work/visual-combat/*/video-frames/frames.json
      - name: Build and validate starter assets (CPU only)
        if: runner.os == 'Linux'
        run: |
          blender -b --factory-startup --python-exit-code 1 --python tools/build_examples.py
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python tests/starter_package_reopen.py
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: blender-vfx-studio-extension
          path: dist/*.zip
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        with:
          name: blender-vfx-studio-preview
          path: |
            work/preview.png
            work/shield-preview.png
            work/emitter-preview.png
            work/bone-trail-preview.png
            work/examples/*.png
            work/visual-slash/*.png
            work/visual-impact/*.png
            work/visual-charge/*/charge-*.png

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: blender
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: blender-vfx-studio-extension
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: blender-vfx-studio-preview
          path: preview
      - name: Publish tested preview ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS preview/*.png preview/examples/*.png preview/visual-slash/*.png preview/visual-impact/*.png preview/visual-charge/*/charge-*.png --verify-tag --prerelease --title "$GITHUB_REF_NAME — Blender VFX Studio Preview" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
