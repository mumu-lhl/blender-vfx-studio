name: Temporary Eevee exit probe
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, empty-scene, single-thread, no-shader-cache]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      EGL_PLATFORM: surfaceless
      LP_NUM_THREADS: '2'
      PROBE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/fetch_blender.py --version 5.2.2
      - name: Ensure Linux software rendering and video tools
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: |
          if python - <<'PYTHON'
          import ctypes, pathlib, shutil
          missing = []
          for name in ('libEGL.so.1', 'libEGL_mesa.so.0', 'libGL.so.1'):
              try:
                  ctypes.CDLL(name)
              except OSError:
                  missing.append(name)
          if not list(pathlib.Path('/usr/lib').glob('*/dri/swrast_dri.so')):
              missing.append('Mesa software DRI driver')
          missing.extend(name for name in ('ffmpeg', 'ffprobe') if not shutil.which(name))
          print('::notice::Render prerequisites: ' + (', '.join(missing) if missing else 'already available'))
          raise SystemExit(bool(missing))
          PYTHON
          then
            exit 0
          fi
          mkdir -p work
          # Ubuntu 24.04 is pinned above. Query only its signed official repositories.
          cat >work/ubuntu-render.sources <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          render_packages=(libegl1 libegl-mesa0 libgl1-mesa-dri)
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            render_packages+=(ffmpeg)
          fi
          apt_options=(-o "Dir::Etc::sourcelist=$PWD/work/ubuntu-render.sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=20)
          if timeout 90 sudo apt-get "${apt_options[@]}" update -qq >work/render-deps.log 2>&1 && timeout 180 sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends "${render_packages[@]}" >>work/render-deps.log 2>&1; then
            cat work/render-deps.log
          else
            python - <<'PYTHON'
          from pathlib import Path
          message = '\n'.join(Path('work/render-deps.log').read_text(errors='replace').splitlines()[-12:])
          print('::error::Render dependency preparation failed: ' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON
            exit 1
          fi
      - name: Build a truthful two-frame diagnostic scene
        run: |
          mkdir -p work
          cat > work/exit-probe.py <<'PYTHON'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from tools import charge_handoff
          if os.environ['PROBE_MODE'] == 'legacy':
              from blender_vfx_studio import slash
              create = slash.create
              def legacy(*args, **kwargs):
                  kwargs['asset_version'] = 4
                  return create(*args, **kwargs)
              slash.create = legacy
          charge_handoff.FRAMES = (31, 33)
          charge_handoff.main()
          PYTHON
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 -t 2 --python work/exit-probe.py -- --engine BLENDER_EEVEE --light
      - name: Repeat unchanged native checks and preserve every exit status
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess
          folder = pathlib.Path('work/exit-probe')
          folder.mkdir(exist_ok=True)
          results = []
          command = ['blender', '-b', 'work/charge-handoff/blender_eevee-light/handoff.blend', '--disable-autoexec', '--python-exit-code', '1', '-t', '2', '--python', 'tests/charge_handoff_reopen.py']
          mode = os.environ['PROBE_MODE']
          env = dict(os.environ)
          if mode == 'single-thread':
              env['LP_NUM_THREADS'] = '1'
          if mode == 'no-shader-cache':
              env['MESA_SHADER_CACHE_DISABLE'] = 'true'
          if mode == 'empty-scene':
              wrapper = pathlib.Path('work/cleanup-probe.py')
              wrapper.write_text("import bpy, runpy\nstate = runpy.run_path('tests/charge_handoff_reopen.py')\nbpy.ops.wm.read_factory_settings(use_empty=True)\n")
              command[-1] = str(wrapper)
          for attempt in range(1, 4):
              crash = pathlib.Path('/tmp/blender.crash.txt')
              crash.unlink(missing_ok=True)
              with (folder / f'native-{attempt}.log').open('w') as log:
                  result = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT)
              results.append(result.returncode)
              if crash.is_file():
                  shutil.copy2(crash, folder / f'crash-{attempt}.txt')
          (folder / 'exit-status.json').write_text(json.dumps(results))
          print('Native process exit codes:', results)
          raise SystemExit(1 if any(results) else 0)
          PYTHON
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: temporary-eevee-exit-probe-${{ matrix.mode }}
          path: |
            work/exit-probe/
            work/charge-handoff/
          if-no-files-found: ignore
          retention-days: 7
